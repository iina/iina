name: CI

permissions:
  contents: read

on:
  push:
      branches: [develop]
  pull_request:
      branches: [develop]

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.5"
            deployment_target: ""
    runs-on:  macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./other/download_libs.sh $DOWNLOAD_LIBS_ARGS
        env:
          DOWNLOAD_LIBS_ARGS: ${{ github.event_name == 'pull_request' && '--skip-plugins' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify VVC playback
        run: |
          vvc_sample="$RUNNER_TEMP/iina-vvc-sample.mp4"
          curl --fail --location --silent --show-error "$VVC_SAMPLE_URL" --output "$vvc_sample"
          printf '%s  %s\n' "$VVC_SAMPLE_SHA256" "$vvc_sample" | shasum -a 256 -c -
          ./other/tests/test_vvc_playback.sh "$vvc_sample"
        env:
          VVC_SAMPLE_URL: https://user-images.githubusercontent.com/89560393/227756032-9a697a60-5b26-409c-824d-e2f815df8437.mp4
          VVC_SAMPLE_SHA256: 80085b3482ddd1e7a405997a39d904eb26b5ab05dfe8b77f0333db7c15d71a5b

      - name: Build
        run: xcodebuild -project iina.xcodeproj ONLY_ACTIVE_ARCH=NO -scheme iina -derivedDataPath . -configuration Nightly ${{ matrix.deployment_target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Create DMG
        run: hdiutil create -volname "IINA Nightly" -srcfolder Build/Products/Nightly/IINA.app -ov -format UDZO IINA.dmg

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IINA
          path: IINA.dmg
          archive: false
