# Verbatim excerpt from mpv/input.conf lines 79-81 (the SPACE triplet).
# Used by KeyMappingTests.testParseClickPressReleaseSpace to verify that
# KeyMapping.parseInputConf recognises the #@click / #@press / #@release
# action suffix and produces 3 distinct KeyMapping rows.
 SPACE                cycle pause                                  #@click
 SPACE                no-osd set speed 4; set pause no             #@press
 SPACE                ignore                                       #@release
